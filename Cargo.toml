[package]
name = "simplesync"
version = "1.1.1"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.13", features = ["blocking", "rustls", "json", "form"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
base64 = "0.23"
walkdir = "2"
log = "0.4"
oo7 = { version = "0.7.0-beta", default-features = false, features = ["tokio", "native_crypto"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_9"]

[profile.release]
strip = true
lto = true
opt-level = "s"
